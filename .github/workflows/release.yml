# Manual release: you pick the version number and this does the rest.
#
# Run from: Actions -> "Release pyDOOM" -> Run workflow -> version: 0.11
# It bumps VERSION, commits it to main, tags v0.11, builds the Linux
# and Windows PyInstaller bundles (which read VERSION at build time,
# so HUD/launcher report the release), and publishes the GitHub
# release with both assets attached.
# Needs Settings -> Actions -> General -> Workflow permissions:
# "Read and write permissions" (the `permissions` block below asks
# for it explicitly, but the repo toggle must allow it).

name: Release pyDOOM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (sets VERSION, tag vX, asset names)"
        required: true
        default: "0.11"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Full suite on the shareware IWAD
        run: python -m pytest -q

  prepare:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and tag
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "bad version '${{ inputs.version }}' (want like 0.11)"
            exit 1
          fi
          git fetch --tags origin
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "tag v${{ inputs.version }} already exists"
            exit 1
          fi
      - name: Bump VERSION and tag
        run: |
          echo "${{ inputs.version }}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "bump VERSION to ${{ inputs.version }}" || true
          git push origin HEAD:main
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

  build:
    needs: prepare
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: release-asset-linux
            asset: pyDOOM-${{ inputs.version }}-linux-x86_64.tar.gz
          - os: windows-latest
            artifact: release-asset-windows
            asset: pyDOOM-${{ inputs.version }}-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt pyinstaller
      - name: Build bundle
        run: python -m PyInstaller -y pyDOOM.spec
      - name: Pack Linux tarball
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist pyDOOM
      - name: Pack Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\pyDOOM -DestinationPath "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          merge-multiple: true
          path: assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" assets/* \
            --title "v${{ inputs.version }}" \
            --notes "Vanilla DOOM (linuxdoom-1.10) reimplemented in Python.

          Playable: shareware E1 plus registered E1-E3 end to end (skies, music, pars, secret levels, boss exits, intermissions), finale, and the IWAD demo attract loop.

          Linux asset: extract and run ./pyDOOM/pyDOOM (bundles the shareware DOOM1.WAD; drop a registered doom.wad next to it to unlock E1-E3).

          Windows asset: extract and run pyDOOM/pyDOOM.exe (same deal: DOOM1.WAD inside, doom.wad alongside for E1-E3)."
